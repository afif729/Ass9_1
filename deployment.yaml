apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-portal-deployment
  labels:
    app: lms-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lms-portal
  template:
    metadata:
      labels:
        app: lms-portal
    spec:
      containers:
      - name: lms-portal
        image: afif729/lms-portal:latest
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: lms-portal-service
spec:
  type: NodePort
  selector:
    app: lms-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30008
